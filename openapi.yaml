02.3 Status Dashboard | لوحة الحالة لتطبيق السائق

شاشة لوحة الحالة ومؤشرات HOS كقيم مستهلكة ودائرة التقدم والملخص الأسبوعي وتعديل الحالة
GET
/eld/status
استرجاع بيانات لوحة الحالة لشاشة تطبيق Flutter (Get Status Dashboard)

جلب بيانات حقيقية ومحسوبة لحظياً للوحة الحالة تشمل:

    driver: بيانات هوية السائق (الاسم والمعرف) في الشريط العلوي.
    operationalAlerts: تنبيهات الاتصال التشغيلي مع جهاز ELD/GPS للمركبة.
    currentDutyStatus: حالة السائق الحالية (DRIVING, ON_DUTY, OFF_DUTY, SLEEPER_BERTH).
    remainingCircle: الدائرة المركزية للوقت القانوني المتبقي ونسبة الاكتمال.
    hosIndicators: مؤشرات ساعات الخدمة الأربعة (DRIVE المستهلكة، SHIFT المستهلكة، BREAK المتبقية، CYCLE المستهلكة خلال 8 أيام).
    regulatoryConstraints: القيود التنظيمية المطبقة بموجب لوائح FMCSA (مثل USA 70/8).

Parameters
Try it out
Name	Description
driverId
integer($int64)
(query)
	

معرف السائق (اختياري، يتم جلبه تلقائياً من جلسة السائق)

Example : 479
Responses
Code	Description	Links
200	

