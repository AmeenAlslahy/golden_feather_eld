components:
  schemas:
    ComplianceSummaryResponse:
      type: object
      properties:
        driverId:
          type: integer
          description: معرف السائق
          format: int64
          example: 101
        driver:
          $ref: "#/components/schemas/DriverResponse"
        complianceScore:
          type: number
          description: درجة ومؤشر الامتثال المئوي (0 - 100%)
          format: double
          example: 98.5
        drivingRemainingMinutes:
          type: integer
          description: ساعات القيادة المتبقية اليوم (دقائق)
          format: int32
          example: 360
        dutyRemainingMinutes:
          type: integer
          description: ساعات الخدمة والعمل المتبقية اليوم (دقائق)
          format: int32
          example: 540
        cycleRemainingMinutes:
          type: integer
          description: ساعات الدورة الأسبوعية المتبقية (دقائق)
          format: int32
          example: 2400
        activeViolationsCount:
          type: integer
          description: عدد المخالفات النشطة الحالية
          format: int32
          example: 0
        status:
          type: string
          description: "حالة الامتثال العامة: COMPLIANT | WARNING | NON_COMPLIANT"
          example: COMPLIANT
      description: كائن استجابة ملخص ومؤشر امتثال السائق لقواعد ساعات الخدمة
    DriverResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        email:
          type: string
        uniqueId:
          type: string
        licenseNumber:
          type: string
        licenseState:
          type: string
        carrierName:
          type: string
        carrierUsdot:
          type: string
        status:
          type: string
    DatabaseConfig:
      type: object
      properties:
        driverClassName:
          type: string
        jdbcUrl:
          type: string
        username:
          type: string
        password:
          type: string
        maximumPoolSize:
          type: integer
          format: int32
        minimumIdle:
          type: integer
          format: int32
        idleTimeout:
          type: integer
          format: int64
        connectionTimeout:
          type: integer
          format: int64
    ELDConfiguration:
      type: object
      properties:
        server:
