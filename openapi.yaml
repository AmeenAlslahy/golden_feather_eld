openapi: 3.0.1
info:
  title: Traccar ELD / HOS Engine REST API
  description: واجهة برمجة التطبيقات الكاملة لنظام إدارة ساعات الخدمة (HOS) والسجلات
    الإلكترونية (ELD) المولدة تلقائياً من OpenAPI Annotations في الـ Controllers
  contact:
    name: ELD Core Engineering Team
    email: support@traccar.org
  version: 1.0.0
servers:
- url: /api
  description: Current Server (Traccar + ELD)
tags:
- name: 2. Compliance Engine | محرك الامتثال والقواعد
  description: حساب الساعات المتبقية، تقييم السائقين، والتحقق من الامتثال لقواعد FMCSA
- name: 13. System Configuration | الإعدادات العامة والتنظيمية
  description: إدارة إعدادات HOS والحدود الاستثنائية وتأطير الأنظمة التنظيمية
- name: 10. Real-Time Dashboard | لوحة المتابعة المباشرة
  description: ملخص مباشر للأسطول وبث التحديثات اللحظية عبر Server-Sent Events (SSE)
- name: 8. Diagnostics & Malfunctions | الأعطال والتشخيص
  description: مراقبة الأعطال التشخيصية في أجهزة ELD وسجلات الحالة وفق FMCSA §395.22
- name: 5. Documents & Certification | المستندات والوثائق
  description: إدارة مستندات الامتثال المرتبطة بنشاط السائق (فواتير، تصاريح، شهادات...)
- name: 14. System Health & Diagnostics | صحة وجاهزية النظام
  description: فحص سلامة وجاهزية مكونات نظام ELD (قاعدة البيانات، التخزين، المجدول)
- name: 6. Roadside Inspection | التفتيش الميداني الرقابي
  description: إدارة جلسات التفتيش الرقابي وتوليد تقارير التفتيش ورموز QR
- name: 4. ELD Reports | تقارير السجلات الإلكترونية
  description: توليد وتصدير تقارير ELD اليومية والأسبوعية والتنفيذية بصيغ PDF و CSV
    و HTML و XML
- name: 11. Driver Rules | إدارة لوائح السائقين
  description: تخصيص وإدارة قواعد ولوائح الامتثال والاستثناءات لكل سائق
- name: 12. Driver Sessions | إدارة جلسات القيادة
  description: إدارة جلسات السائقين والسائق المساعد (Co-Driver) وتبادل الأدوار
- name: 7. Signatures & Certificates | التواقيع والمصادقة
  description: إدارة التواقيع الإلكترونية المعتمدة للسجلات اليومية (RODS)
- name: 9. Fleet Statistics & Scores | إحصائيات ومؤشرات الأسطول
  description: إحصائيات الأسطول، نسب الامتثال، وحساب درجات الامتثال بالأوزان النقطية
    مع دعم الفلاتر
- name: 1. Duty Status (HOS) | إدارة ساعات وحالات الخدمة
  description: تسجيل وتحديث حالات السائق اللحظية وقراءات العداد والموقع وساعات المحرك
- name: 3. Violations | إدارة المخالفات
  description: سجل المخالفات المكتشفة وتفاصيلها وإدارة دورة حياتها والاعتراض والمعالجة
paths:
  /eld/compliance/{driverId}/evaluate:
    get:
      tags:
      - 2. Compliance Engine | محرك الامتثال والقواعد
      summary: تقييم امتثال السائق (Evaluate Driver Compliance)
      description: "تقييم سجلات السائق وحساب أي مخالفات نشطة وتعبئة كائنات العلاقا\
        ت المترابطة الثلاث (Driver, Device, Period)."
      operationId: evaluateCompliance
      parameters:
      - name: driverId
        in: path
        description: معرف السائق
        required: true
        schema:
          type: integer
          format: int64
        example: 101
      responses:
        "200":
          description: تم التقييم بنجاح
        "400":
          description: طلب غير صالح أو بيانات مدخلة غير صحيحة
        "401":
          description: غير مصرح — يلزم تسجيل الدخول والمصادقة
        "403":
          description: محظور — ليس لديك صلاحية على هذا المورد
        "500":
          description: خطأ داخلي في الخادم أو قاعدة البيانات
      security:
      - BasicAuth: []
  /eld/compliance/{driverId}/remaining:
    get:
      tags:
      - 2. Compliance Engine | محرك الامتثال والقواعد
      summary: الساعات المتبقية ومؤشر الامتثال للسائق (Get Driver Remaining Hours
        & Score)
      description: استرجاع الساعات المتبقية للقيادة والعمل والدورة الأسبوعية ومؤشر
        الامتثال وتعبئة علاقة السائق غير الفارغة عبر المابر.
      operationId: getRemainingHours
      parameters:
      - name: driverId
        in: path
        description: معرف السائق
        required: true
        schema:
          type: integer
          format: int64
        example: 101
      responses:
        "200":
          description: تم جلب البيانات بنجاح
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComplianceSummaryResponse"
        "400":
          description: طلب غير صالح أو بيانات مدخلة غير صحيحة
        "401":
          description: غير مصرح — يلزم تسجيل الدخول والمصادقة
        "403":
          description: محظور — ليس لديك صلاحية على هذا المورد
        "500":
          description: خطأ داخلي في الخادم أو قاعدة البيانات
      security:
      - BasicAuth: []
  /eld/config:
    get:
      tags:
      - 13. System Configuration | الإعدادات العامة والتنظيمية
      summary: جلب إعدادات ELD الحالية (Get ELD Configuration)
      description: استرجاع إعدادات وقواعد ساعات الخدمة الحالية.
      operationId: getConfiguration
      responses:
        "200":
          description: تم جلب الإعدادات بنجاح
        "400":
          description: طلب غير صالح أو بيانات مدخلة غير صحيحة
        "401":
          description: غير مصرح — يلزم تسجيل الدخول والمصادقة
        "403":
          description: محظور — ليس لديك صلاحية على هذا المورد
        "500":
          description: خطأ داخلي في الخادم أو قاعدة البيانات
      security:
      - BasicAuth: []
    put:
      tags:
      - 13. System Configuration | الإعدادات العامة والتنظيمية
      summary: تحديث قواعد وإعدادات HOS (Update HOS Config — Admin Only)
      description: تحديث حدود ساعات القيادة والعمل والاستراحة لجميع السائقين.
      operationId: updateConfiguration
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateHosConfigRequest"
      responses:
        "200":
          description: تم تحديث الإعدادات بنجاح
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ELDConfiguration"
        "400":
          description: طلب غير صالح أو بيانات مدخلة غير صحيحة
        "401":
          description: غير مصرح — يلزم تسجيل الدخول والمصادقة
        "403":
          description: محظور — ليس لديك صلاحية على هذا المورد
        "500":
          description: خطأ داخلي في الخادم أو قاعدة البيانات
      security:
      - BasicAuth: []
  /eld/config/db-settings:
    get:
      tags:
      - 13. System Configuration | الإعدادات العامة والتنظيمية
      summary: استرجاع إعدادات قاعدة البيانات (Get DB Settings)
      description: جلب كافة مفاهيم وإعدادات النظام المسجلة ديناميكياً في جدول eld_settings.
      operationId: getDatabaseSettings
      responses:
        "200":
          description: تم جلب الإعدادات بنجاح
        "400":
          description: طلب غير صالح أو بيانات مدخلة غير صحيحة
        "401":
          description: غير مصرح — يلزم تسجيل الدخول والمصادقة
        "403":
          description: محظور — ليس لديك صلاحية على هذا المورد
        "500":
          description: خطأ داخلي في الخادم أو قاعدة البيانات
      security:
      - BasicAuth: []
    put:
      tags:
      - 13. System Configuration | الإعدادات العامة والتنظيمية
      summary: تحديث قيمة إعداد في قاعدة البيانات (Update DB Setting)
      description: تحديث قيمة إعداد ديناميكي في eld_settings وإعادة تحميل التكوين
        الفوري.
      operationId: updateDatabaseSetting
      parameters:
      - name: key
        in: query
        description: مفتاح الإعداد
        required: true
        schema:
          type: string
        example: hos.maxDrivingHoursPerDay
      - name: value
        in: query
        description: القيمة الجديدة
        required: true
        schema:
          type: string
        example: 11.0
      - name: category
        in: query
        description: الفئة
        schema:
          type: string
        example: HOS
      - name: description
        in: query
        description: الوصف
        schema:
          type: string
      responses:
        "200":
          description: تم تحديث الإعداد بنجاح
        "400":
          description: طلب غير صالح أو بيانات مدخلة غير صحيحة
        "401":
          description: غير مصرح — يلزم تسجيل الدخول والمصادقة
        "403":
          description: محظور — ليس لديك صلاحية على هذا المورد
        "500":
          description: خطأ داخلي في الخادم أو قاعدة البيانات
      security:
      - BasicAuth: []
  /eld/config/regulations:
    get:
      tags:
      - 13. System Configuration | الإعدادات العامة والتنظيمية
      summary: قائمة الأنظمة التنظيمية المدعومة (List Supported Regulation Profiles)
      description: استرجاع قائمة الأنظمة المتاحة المسجلة في قاعدة البيانات.
      operationId: getSupportedRegulations
      responses:
        "200":
          description: قائمة الأنظمة التنظيمية
        "400":
          description: طلب غير صالح أو بيانات مدخلة غير صحيحة
        "401":
          description: غير مصرح — يلزم تسجيل الدخول والمصادقة
        "403":
          description: محظور — ليس لديك صلاحية على هذا المورد
        "500":
          description: خطأ داخلي في الخادم أو قاعدة البيانات
      security:
      - BasicAuth: []
  /eld/config/regulations/active:
    put:
      tags:
      - 13. System Configuration | الإعدادات العامة والتنظيمية
      summary: تنسيق النظام التنظيمي المفعّل (Switch Active Regulation Profile — Admin
        Only)
      description: تغيير النظام التنظيمي المفعّل عالمياً في المحرك وبثه بقاعدة البيانات
        بنقرة واحدة.
      operationId: switchActiveRegulation
      parameters:
      - name: profileId
        in: query
        description: "معرف النظام المراد تفعيله: FMCSA_US | EU_2006 | CUSTOM"
        required: true
        schema:
          type: string
      responses:
        "200":
          description: تم تبديل النظام التنظيمي بنجاح
        "400":
          description: طلب غير صالح أو بيانات مدخلة غير صحيحة
        "401":
          description: غير مصرح — يلزم تسجيل الدخول والمصادقة
        "403":
          description: محظور — ليس لديك صلاحية على هذا المورد
        "500":
          description: خطأ داخلي في الخادم أو قاعدة البيانات
      security:
      - BasicAuth: []
  /eld/dashboard/summary:
    get:
      tags:
      - 10. Real-Time Dashboard | لوحة المتابعة المباشرة
      summary: ملخص مؤشرات الأسطول المباشر (Get Live Fleet Summary)
      description: استرجاع إحصائيات الأسطول التراكمية الحية للسائقين والمركبات المصرح
        بها.
      operationId: getFleetSummary
      parameters:
      - name: groupId
        in: query
        description: معرف المجموعة للتصفية (اختياري)
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: إحصائيات الأسطول المباشرة
        "400":
          description: طلب غير صالح أو بيانات مدخلة غير صحيحة
        "401":
          description: غير مصرح — يلزم تسجيل الدخول والمصادقة
        "403":
          description: محظور — ليس لديك صلاحية على هذا المورد
        "500":
          description: خطأ داخلي في الخادم أو قاعدة البيانات
      security:
      - BasicAuth: []
  /eld/dashboard/stream:
    get:
      tags:
      - 10. Real-Time Dashboard | لوحة المتابعة المباشرة
      summary: بث تحديثات الأسطول اللحظية (Stream Live Dashboard Events - SSE)
      description: قناة بث لحظي مستمر لأحداث وتغييرات حالات السائقين عبر Server-Sent
        Events.
      operationId: streamDashboardUpdates
      responses:
        "200":
          description: بث أحداث SSE المباشرة
        "400":
          description: طلب غير صالح أو بيانات مدخلة غير صحيحة
        "401":
          description: غير مصرح — يلزم تسجيل الدخول والمصادقة
        "403":
          description: محظور — ليس لديك صلاحية على هذا المورد
        "500":
          description: خطأ داخلي في الخادم أو قاعدة البيانات
      security:
      - BasicAuth: []
  /eld/diagnostics/{id}/clear:
    put:
      tags:
      - 8. Diagnostics & Malfunctions | الأعطال والتشخيص
      summary: إغلاق وتصحيح العطل التشخيصي (Clear Diagnostic Malfunction — Admin Only)
      description: مسح وإغلاق كود العطل التشخيصي وفق متطلبات الصيانة والمراقبة FMCSA
        §395.22.
      operationId: clearDiagnostic
      parameters:
      - name: id
        in: path
        description: معرف العطل التشخيصي
        required: true
        schema:
          type: integer
          format: int64
        example: 7
      responses:
        "200":
          description: تمت معالجة وإغلاق العطل بنجاح
        "400":
          description: طلب غير صالح أو بيانات مدخلة غير صحيحة
        "401":
          description: غير مصرح — يلزم تسجيل الدخول والمصادقة
        "403":
          description: محظور — ليس لديك صلاحية على هذا المورد
        "500":
          description: خطأ داخلي في الخادم أو قاعدة البيانات
      security:
      - BasicAuth: []
  /eld/diagnostics/{driverId}:
    get:
      tags:
      - 8. Diagnostics & Malfunctions | الأعطال والتشخيص
      summary: التشخيصات الفنية للسائق (Get Driver ELD Diagnostics)
      description: استرجاع قائمة الأعطال التشخيصية المسجّلة للسائق مع تعبئة علاقتي
        السائق والجهاز بالكامل.
      operationId: getDriverDiagnostics
      parameters:
      - name: driverId
        in: path
        description: معرف السائق
        required: true
        schema:
          type: integer
          format: int64
        example: 101
      - name: severity
        in: query
        description: "التصفية حسب درجة الخطورة: CRITICAL | WARNING | INFO"
        schema:
          type: string
      responses:
        "200":
          description: قائمة التشخيصات الممتلئة بالعلاقات
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DiagnosticResponse"
        "400":
          description: طلب غير صالح أو بيانات مدخلة غير صحيحة
        "401":
          description: غير مصرح — يلزم تسجيل الدخول والمصادقة
        "403":
          description: محظور — ليس لديك صلاحية على هذا المورد
        "500":
          description: خطأ داخلي في الخادم أو قاعدة البيانات
      security:
      - BasicAuth: []
  /eld/diagnostics/fleet:
    get:
      tags:
      - 8. Diagnostics & Malfunctions | الأعطال والتشخيص
      summary: ملخص الأعطال التشخيصية للأسطول (Fleet Diagnostics Summary)
      description: إحصائية شاملة للأعطال النشطة على مستوى الأسطول شاملة كائنات العلاقات
        المترابطة بالكامل.
      operationId: getFleetDiagnostics
      responses:
        "200":
          description: ملخص تشخيصات الأسطول المشتمل على العلاقات
        "400":
          description: طلب غير صالح أو بيانات مدخلة غير صحيحة
        "401":
          description: غير مصرح — يلزم تسجيل الدخول والمصادقة
        "403":
          description: محظور — ليس لديك صلاحية على هذا المورد
        "500":
          description: خطأ داخلي في الخادم أو قاعدة البيانات
      security:
      - BasicAuth: []
  /eld/documents/{id}:
    delete:
      tags:
      - 5. Documents & Certification | المستندات والوثائق
      summary: حذف مستند امتثالي (Delete ELD Document)
      description: حذف مستند — مسموح لصاحب المستند أو المشرف فقط.
      operationId: deleteDocument
      parameters:
      - name: id
        in: path
        description: معرف المستند
        required: true
        schema:
          type: integer
          format: int64
        example: 15
      responses:
        "200":
          description: تمت العملية بنجاح
        "400":
          description: طلب غير صالح أو بيانات مدخلة غير صحيحة
        "401":
          description: غير مصرح — يلزم تسجيل الدخول والمصادقة
        "403":
          description: محظور — ليس لديك صلاحية على هذا المورد
        "500":
          description: خطأ داخلي في الخادم أو قاعدة البيانات
        "204":
          description: تم الحذف بنجاح
        "404":
          description: المستند غير موجود
      security:
      - BasicAuth: []
  /eld/documents/download/{docId}:
    get:
      tags:
      - 5. Documents & Certification | المستندات والوثائق
      summary: تنزيل ملف وثيقة ELD (Download Document File)
      description: تنزيل الملف المُرفق بوثيقة ELD محددة — متاح لصاحب الوثيقة أو المشرف
        فقط.
      operationId: downloadDocumentFile
      parameters:
      - name: docId
        in: path
        description: معرف الوثيقة
        required: true
        schema:
          type: integer
          format: int64
        example: 42
      responses:
        "200":
          description: الملف جاهز للتنزيل
        "400":
          description: طلب غير صالح أو بيانات مدخلة غير صحيحة
        "401":
          description: غير مصرح — يلزم تسجيل الدخول والمصادقة
        "403":
          description: محظور — ليس لديك صلاحية على هذا المورد
        "500":
          description: خطأ داخلي في الخادم أو قاعدة البيانات
        "404":
          description: الوثيقة أو الملف غير موجود
      security:
      - BasicAuth: []
  /eld/documents/{driverId}:
    get:
      tags:
      - 5. Documents & Certification | المستندات والوثائق
      summary: قائمة المستندات الامتثالية للسائق (Get Driver ELD Documents)
      description: استرجاع قائمة جميع المستندات المرتبطة بالسائق مع دعم التصفية حسب
        النوع وعلاقات السائق والفترة والموثق المكاملة عبر المابر.
      operationId: getDocuments
      parameters:
      - name: driverId
        in: path
        description: معرف السائق
        required: true
        schema:
          type: integer
          format: int64
        example: 101
      - name: type
        in: query
        description: نوع المستند للتصفية (اختياري)
        schema:
          type: string
        example: BILL_OF_LADING
      responses:
        "200":
          description: تم استرجاع قائمة المستندات
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DocumentResponse"
        "400":
          description: طلب غير صالح أو بيانات مدخلة غير صحيحة
        "401":
          description: غير مصرح — يلزم تسجيل الدخول والمصادقة
        "403":
          description: محظور — ليس لديك صلاحية على هذا المورد
        "500":
          description: خطأ داخلي في الخادم أو قاعدة البيانات
      security:
      - BasicAuth: []
    post:
      tags:
      - 5. Documents & Certification | المستندات والوثائق
      summary: رفع مستند امتثالي جديد (Upload ELD Document)
      description: رفع مستند جديد مرتبط بنشاط السائق الامتثالي وتعبئة علاقة السائق
        عبر المابر.
      operationId: uploadDocument
      parameters:
      - name: driverId
        in: path
        description: معرف السائق
        required: true
        schema:
          type: integer
          format: int64
