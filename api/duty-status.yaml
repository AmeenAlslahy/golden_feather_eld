5.1. تنبيهات هامة لنظام ELD/HOS
التنبيه	الوصف
دقة بيانات الإشعال والسرعة	يعتمد التقرير على دقة بيانات الإشعال والسرعة من أجهزة التتبع. بيانات خاطئة قد تؤدي إلى تصنيف غير صحيح للحالات.
فجوات البيانات	الفجوات الزمنية الكبيرة (أكثر من data_gap_threshold) تُعتبر فترات توقف افتراضية، مما قد يؤثر على دقة التقرير.
المنطقة الزمنية	يجب ضبط timezone بشكل صحيح لتتناسب مع موقع السائقين والمركبات، وإلا قد تكون التواريخ غير صحيحة.
الشهادة الإلكترونية	إذا كان certification_required = true، يجب التأكد من وجود شهادة إلكترونية في السجلات، وإلا سيتم تسجيل تشخيص missing_certification.
التعديل اليدوي	يجب توثيق أي تعديل يدوي للحالة (manual_edit = true) لضمان الشفافية في حالة التدقيق التنظيمي.
الراحة الأسبوعية	يجب أن تكون 34 ساعة متتالية من الراحة (خارج الخدمة أو نوم في المركبة). الكلاس يتحقق من التتابع فقط.
مدة الاحتفاظ بالبيانات	يجب الاحتفاظ بالبيانات لمدة 8 أيام على الأقل لتلبية متطلبات التفتيش.
صلاحيات API	تأكد من منح المستخدمين الصلاحيات المناسبة للوصول إلى نقاط نهاية ELD/HOS.
5.2. التوصيات وأفضل الممارسات
تحديث الإعدادات حسب القوانين المحلية: قد تختلف حدود ELD/HOS حسب الدولة أو نوع النشاط؛ استخدم الإعدادات لتخصيص التقرير.

دمج التقارير في نظام إدارة الأسطول: استخدم نقاط نهاية التصدير لدمج التقارير في لوحات التحكم.

جدولة التقارير: يمكن أتمتة توليد التقارير باستخدام نقاط نهاية المهام المجدولة (createScheduledTask) مع تصديرها إلى CSV أو PDF وإرسالها عبر البريد الإلكتروني.

استخدام الترجمة: فعّل خاصية use_lang وقدم ملفات ترجمة كاملة للغات المستخدمين (عربي، إنجليزي، إلخ).

التحقق من جودة البيانات: قم بفلترة السجلات غير الصالحة (سرعة سلبية، إحداثيات خاطئة، إلخ) قبل إرسالها للتقرير.

توثيق التشخيصات: استخدم نقاط نهاية التحقق من الامتثال للحصول على قائمة مفصلة بالتشخيصات مع الرسائل المترجمة.

اختبار السيناريوهات: اختبر التقرير مع بيانات محاكاة لتغطية جميع السيناريوهات (قيادة طبيعية، تجاوزات، فجوات، أعطال تشخيصية).

التحقق من الشهادة الإلكترونية: في بيئات الإنتاج، تأكد من أن جميع السجلات تحتوي على شهادة إلكترونية صالحة قبل توليد التقرير النهائي.

معالجة أعطال ELD: استخدم التشخيصات المقدمة لمراقبة صحة أجهزة ELD واتخاذ الإجراءات التصحيحية عند الحاجة.

الامتثال للوائح: تأكد من مراجعة التقرير بانتظام مع الجهات التنظيمية للتأكد من استيفائه للمتطلبات القانونية.

6. الخاتمة
يمثل توثيق واجهة برمجة التطبيقات (API) لخادم Traccar - الجزء الثاني: نقاط نهاية ELD/HOS المتقدمة - مرجعاً شاملاً لجميع نقاط النهاية المتعلقة بالسجلات الإلكترونية وساعات الخدمة في النظام. يغطي هذا الجزء جميع الوظائف المتقدمة التي تمكن المؤسسات من الامتثال الكامل لمعايير FMCSA وإدارة الأسطول بكفاءة عالية.

النقاط الرئيسية التي تم تغطيتها في هذا الجزء:

✅ تسجيل حالة الخدمة: تسجيل الحالات الأربع (قيادة، خدمة، خارج الخدمة، نوم).
✅ حساب ساعات الخدمة: حساب الساعات المستخدمة والمتبقية وفقاً لقواعد FMCSA.
✅ اكتشاف المخالفات: تحديد 7 أنواع من المخالفات مع مستويات خطورة.
✅ تقارير HOS: إنشاء تقارير HOS مفصلة مع تحليل يومي وأسبوعي.
✅ إدارة المستندات الداعمة: رفع وتحميل وحذف المستندات مع أنواع متعددة.
✅ تقارير التفتيش: إنشاء تقارير تفتيش ELD مع بيانات 8 أيام.
✅ تصدير بيانات التفتيش: تصدير بيانات التفتيش بصيغ متعددة (PDF، CSV، JSON).
✅ التقارير الشاملة: إنشاء تقارير ELD شاملة مع تحليلات متقدمة.
✅ جلسات التفتيش: بدء جلسات تفتيش مع إنشاء رمز QR وتصدير البيانات.
✅ المراقبة في الوقت الحقيقي: الاشتراك في تحديثات ELD ومراقبة السائقين لحظياً.
✅ التنبيهات الذكية: إعداد تنبيهات مخصصة مع قواعد مراقبة متقدمة.
✅ التحليلات المتقدمة: تحليل أنماط القيادة وكفاءة الوقود.
✅ إدارة الأجهزة والإعدادات: إعداد أجهزة ELD جديدة وتحديث إعداداتها.
✅ صيانة النظام: إجراء صيانة دورية لنظام ELD.
✅ التدريب والدعم: إنشاء حزم تدريبية للسائقين وتتبع التقدم.
✅ الوثائق والدعم: الحصول على فهرس API ودليل المستخدم.
الاستخدام الموصى به:

دمج نقاط النهاية الأساسية (تسجيل الحالة، حساب الساعات، اكتشاف المخالفات) في تطبيقات السائقين اليومية.
استخدام نقاط النهاية المتقدمة (التقارير الشاملة، جلسات التفتيش، التحليلات) في لوحات تحكم إدارة الأسطول.
تفعيل المراقبة في الوقت الحقيقي والتنبيهات لضمان الامتثال الفوري.
الاستفادة من نقاط نهاية التدريب والدعم لتحسين أداء السائقين باستمرار.
بهذا نكون قد أكملنا التوثيق الشامل لواجهة برمجة التطبيقات (API) لخادم Traccar، والذي يغطي جميع نقاط النهاية الأساسية والمتقدمة والمتعلقة بـ ELD/HOS، مع توفير أمثلة كاملة ودقيقة لكل نقطة نهاية.