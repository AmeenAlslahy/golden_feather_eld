3.7.1. الحصول على قائمة الأحداث
GET /events
الوصف: الحصول على قائمة بالأحداث المسجلة في النظام.

معاملات Query
المعامل	النوع	الإلزامية	الوصف
deviceId	integer	لا	تصفية حسب معرف الجهاز
type	string	لا	تصفية حسب نوع الحدث
from	string	لا	تاريخ البداية (ISO 8601)
to	string	لا	تاريخ النهاية (ISO 8601)
limit	integer	لا	الحد الأقصى لعدد النتائج
أنواع الأحداث المدعومة
النوع	الوصف
deviceOnline	الجهاز متصل
deviceOffline	الجهاز غير متصل
deviceUnknown	حالة الجهاز غير معروفة
geofenceEnter	دخول المنطقة الجغرافية
geofenceExit	خروج المنطقة الجغرافية
commandResult	نتيجة الأمر
driverStatusChange	تغيير حالة السائق
documentUploaded	رفع مستند
engineOn	تشغيل المحرك
engineOff	إطفاء المحرك
motionStart	بدء الحركة
motionStop	توقف الحركة
