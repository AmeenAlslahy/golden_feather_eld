5. نقاط النهاية المتعلقة بـ ELD/HOS
يتم توثيق نقاط النهاية المتعلقة بـ ELD/HOS بشكل مفصل في الجزء الثاني من هذا التوثيق، والذي يغطي:

تسجيل حالة الخدمة (Duty Status)
حساب ساعات الخدمة المتاحة (Available Hours)
اكتشاف مخالفات ساعات الخدمة (HOS Violations)
إنشاء تقارير HOS
إدارة المستندات الداعمة
إنشاء تقارير التفتيش
تصدير بيانات التفتيش
التحقق من امتثال ELD
التقارير الشاملة والتحليلات المتقدمة
المراقبة في الوقت الحقيقي والتنبيهات
إدارة الأجهزة والإعدادات المتقدمة
6.1. تنبيهات هامة
التنبيه	الوصف
المصادقة	جميع الطلبات تتطلب جلسة مصادقة صالحة. تأكد من تسجيل الدخول عبر TraccarService قبل إرسال أي طلب.
المهلة الزمنية	تم تعيين مهلة زمنية للطلبات بـ 30 ثانية. قد تحتاج إلى زيادة هذه المهلة للطلبات الكبيرة أو في شبكات بطيئة.
حجم البيانات	يوصى بعدم تجاوز 1000 سجل في طلب واحد لتجنب مشاكل الأداء. استخدم التصفية والترقيم للحد من النتائج.
نطاق التواريخ	عند طلب بيانات تاريخية، حدد نطاقاً زمنياً معقولاً (يفضل أقل من 30 يوماً) لتحسين الأداء.
أخطاء الاتصال	في حالة فشل الاتصال، يقوم TraccarService بإرجاع رسائل خطأ واضحة. تحقق من إعدادات الاتصال و URL الخادم.
صحة المعرفات	تأكد من صحة معرفات الأجهزة والمستخدمين والمجموعات قبل إرسال الطلبات.
الصلاحيات	قد تكون بعض نقاط النهاية مقيدة بصلاحيات المستخدم. تأكد من أن المستخدم لديه الصلاحيات الكافية.
6.2. التوصيات وأفضل الممارسات
إعادة استخدام الجلسة: استخدم نفس كائن TraccarService لإعادة استخدام الجلسة بدلاً من إنشاء جلسة جديدة لكل طلب.

التصفية المسبقة: استخدم معاملات التصفية (مثل deviceId, from, to) لتقليل حجم البيانات المسترجعة.

الترقيم (Pagination): استخدم معامل limit مع offset أو page لتصفح مجموعات كبيرة من البيانات.

معالجة الأخطاء: تأكد من التحقق من حقل success في الاستجابة قبل معالجة البيانات.

الاختبار: اختبر نقاط النهاية مع بيانات اختبارية قبل الاستخدام في بيئة الإنتاج.

التوثيق: راجع توثيق Traccar الرسمي للحصول على تفاصيل إضافية حول نقاط النهاية.

المراقبة: راقب أداء النظام ووقت استجابة نقاط النهاية لتحديد أي اختناقات.

النسخ الاحتياطي: قم بإنشاء نسخ احتياطية دورية للبيانات المهمة باستخدام نقاط نهاية النسخ الاحتياطي.

7. الخاتمة
يمثل توثيق واجهة برمجة التطبيقات (API) لخادم Traccar مرجعاً شاملاً لجميع نقاط النهاية المتاحة في النظام. يغطي هذا التوثيق الجزء الأول من نقاط النهاية الأساسية والمتقدمة، مع توفير أمثلة كاملة ودقيقة لكل نقطة نهاية.

النقاط الرئيسية التي تم تغطيتها في هذا الجزء:

✅ الجلسات: تسجيل الدخول، معلومات الجلسة، تسجيل الخروج.
✅ الأجهزة: إنشاء، تحديث، حذف، استعلام، بحث متقدم.
✅ المجموعات: إدارة المجموعات وتنظيم الأجهزة.
✅ المواقع: الحصول على المواقع التاريخية واللحظية.
✅ المناطق الجغرافية: إنشاء وإدارة المناطق.
✅ المستخدمين: إدارة المستخدمين والصلاحيات.
✅ الأحداث: تتبع الأحداث وإنشاء أحداث جديدة.
✅ السائقين: إدارة السائقين ومعلوماتهم.
✅ البث الحي: تتبع المواقع في الوقت الحقيقي.
✅ التقارير المتقدمة: تقارير الرحلات والتوقفات الممتدة.
✅ الأوامر: إدارة الأوامر في قائمة الانتظار.
سيتم تغطية نقاط النهاية المتعلقة بـ ELD/HOS بالتفصيل في الجزء الثاني من هذا التوثيق، والتي تشمل تسجيل حالة الخدمة، وحساب ساعات الخدمة، واكتشاف المخالفات، وتقارير التفتيش، والمستندات الداعمة، والمراقبة في الوقت الحقيقي، والتنبيهات، والإدارة المتقدمة.

1.1. المقدمة
يوفر نظام ELD (Electronic Logging Device) و HOS (Hours of Service) داخل واجهة برمجة التطبيقات (API) لخادم Traccar مجموعة متكاملة وشاملة من نقاط النهاية لإدارة الامتثال التنظيمي وفقاً لمعايير إدارة السلامة الفيدرالية للنقل (FMCSA) في الولايات المتحدة الأمريكية. تم بناء هذه النقاط باستخدام سمة TraccarEldEndpoints التي توسع TraccarService، مما يوفر للمطورين والمؤسسات أدوات قوية لتسجيل حالة السائق، وحساب ساعات الخدمة، واكتشاف المخالفات، وإنشاء تقارير التفتيش، وإدارة المستندات الداعمة، والمراقبة في الوقت الحقيقي.

الهدف الرئيسي هو تمكين أنظمة إدارة الأسطول من:

تسجيل حالات السائق الأربع (قيادة، خدمة، خارج الخدمة، نوم) تلقائياً ويدوياً.
حساب ساعات الخدمة المتاحة وفق قواعد FMCSA.
اكتشاف المخالفات اليومية والأسبوعية والدورية.
إنشاء تقارير HOS و ELD شاملة للتقديم للجهات التنظيمية.
إدارة المستندات الداعمة (فواتير، إيصالات، تصاريح).
تنظيم عمليات التفتيش على الطريق والمحطات.
المراقبة في الوقت الحقيقي للسائقين والتنبيهات الذكية.
تحليل أنماط القيادة وكفاءة الوقود.
إدارة أجهزة ELD وإعداداتها.
1.2. المعايير المدعومة
تلتزم نقاط نهاية ELD/HOS بمعايير FMCSA التالية:

المعيار	القيمة	المرجع
الحد الأقصى لساعات القيادة اليومية	11 ساعة	FMCSA §395.3(a)(1)
الحد الأقصى لساعات الخدمة اليومية	14 ساعة	FMCSA §395.3(a)(2)
الحد الأدنى للراحة اليومية	10 ساعات	FMCSA §395.3(a)(3)
الحد الأقصى لدورة 7 أيام	60 ساعة	FMCSA §395.3(b)(1)
الحد الأقصى لدورة 8 أيام	70 ساعة	FMCSA §395.3(b)(2)
استراحة 30 دقيقة بعد 8 ساعات قيادة	30 دقيقة	FMCSA §395.3(a)(3)(ii)
الراحة الأسبوعية المتتالية	34 ساعة	FMCSA §395.3(c)
الاحتفاظ بالبيانات للتفتيش	8 أيام	FMCSA §395.15
2.1. الميزات الأساسية لنظام ELD/HOS
الميزة	الوصف
تسجيل الحالات التلقائي	تسجيل حالة السائق تلقائياً بناءً على سرعة المركبة وحالة الإشعال.
الدعم الكامل لحالات السائق الأربع	قيادة (driving)، خدمة (on_duty)، خارج الخدمة (off_duty)، نوم (sleeper_berth).
حساب ساعات الخدمة المتاحة	حساب الساعات المتبقية للقيادة والعمل والراحة وفق قواعد FMCSA.
اكتشاف المخالفات	تحديد 7 أنواع من المخالفات مع مستويات خطورة (بسيط، متوسط، عالي، حرج).
التقارير الشاملة	تقارير HOS و ELD بصيغ متعددة (PDF، CSV، JSON، XML، HTML).
إدارة المستندات الداعمة	رفع وتحميل وحذف والتحقق من المستندات (فواتير، إيصالات، تصاريح).
التفتيش على الطريق	بدء جلسات تفتيش، إنشاء تقارير التفتيش، تصدير بيانات ELD للمفتشين.
المراقبة في الوقت الحقيقي	الاشتراك في تحديثات حالة السائق والمخالفات، مراقبة السائقين لحظياً.
التنبيهات الذكية	إعداد تنبيهات مخصصة لتجاوز الحدود، نقص الراحة، والمخالفات المحتملة.
التحليلات المتقدمة	تحليل أنماط القيادة، كفاءة الوقود، وتوصيات التحسين.
إدارة الأجهزة والإعدادات	إعداد أجهزة ELD جديدة، تحديث الإعدادات، صيانة النظام.
التدريب والدعم	إنشاء حزم تدريب للسائقين، تتبع التقدم، وإنشاء أدلة المستخدم.
2.2. الفوائد للمطورين والمسؤولين
جاهز للإنتاج: معالجة استثنائية شاملة مع رسائل خطأ واضحة.
مرونة عالية: دعم جميع نقاط نهاية ELD/HOS مع إمكانية التوسع.
تكامل سلس: يمكن دمجها بسهولة مع أنظمة إدارة الأسطول، تطبيقات السائقين، ولوحات التحكم.
أمان متقدم: مصادقة OAuth 2.0 مع صلاحيات دقيقة.
توثيق شامل: كل نقطة نهاية موثقة بشكل كامل مع أمثلة دقيقة.
قابلية التوسع: يمكن إضافة نقاط نهاية جديدة بسهولة عبر السمات (Traits).
3.1.1. تسجيل حالة الخدمة
POST /drivers/{driverId}/duty-status
الوصف: تسجيل حالة الخدمة الحالية للسائق (قيادة، خدمة، خارج الخدمة، نوم). يتم إنشاء حدث في Traccar من النوع driverStatusChange مع حفظ البيانات في سمات الحدث.

معاملات المسار
المعامل	النوع	الإلزامية	الوصف
driverId	integer	نعم	معرف السائق
معاملات Body (JSON)
المعامل	النوع	الإلزامية	الوصف	القيمة الافتراضية
status	string	نعم	حالة الخدمة: driving, on_duty, off_duty, sleeper_berth	-
deviceId	integer	لا	معرف الجهاز المرتبط	null
positionId	integer	لا	معرف الموقع الحالي	null
location	string	لا	وصف الموقع النصي	'غير محدد'
odometer	float	لا	قراءة عداد المسافة (كم)	0
engineHours	float	لا	ساعات تشغيل المحرك	0
remarks	string	لا	ملاحظات إضافية	''
attributes	object	لا	سمات إضافية	{}
أنواع الحالات المدعومة
الحالة	الكود	الوصف
قيادة	driving	المركبة تتحرك والإشعال يعمل
في الخدمة	on_duty	الإشعال يعمل ولكن المركبة متوقفة (عمل)
خارج الخدمة	off_duty	الإشعال مطفأ (راحة)
نوم في المركبة	sleeper_berth	راحة في مقصورة النوم
