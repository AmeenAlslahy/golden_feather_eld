1.1. المقدمة
توفر واجهة برمجة التطبيقات (API) لخادم Traccar مجموعة متكاملة وشاملة من نقاط النهاية للتفاعل مع نظام تتبع المركبات المتقدم. تم تطوير هذه الواجهة باستخدام كلاس TraccarService الذي يتواصل مع خادم Traccar عبر واجهة RESTful API، مع دعم كامل للمصادقة والجلسات، وإدارة الأجهزة، والمواقع، والتقارير، والأوامر، والمناطق الجغرافية، والمستخدمين، والأحداث، والإشعارات، والعديد من الميزات المتقدمة الأخرى.

تم بناء هذا النظام ضمن بيئة NanoSoft APP باستخدام إضافة Nano3\Tracker، ويوفر للمطورين والمؤسسات وسيلة سهلة وآمنة للتفاعل مع خادم التتبع Traccar، مع دعم كامل لميزات ELD (السجلات الإلكترونية) و HOS (ساعات الخدمة) المتوافقة مع معايير FMCSA.

الهدف الرئيسي هو تمكين أنظمة إدارة الأسطول وتطبيقات التتبع من:

إدارة الأجهزة (إنشاء، تحديث، حذف، استعلام).
تتبع المواقع في الوقت الحقيقي والتاريخي.
إنشاء وإدارة التقارير المتقدمة (الرحلات، التوقفات، الملخصات، المسارات).
إرسال الأوامر إلى الأجهزة (إيقاف التشغيل، إعادة التشغيل، تحديث الإعدادات).
إدارة المناطق الجغرافية (Geofences) والتنبيهات.
إدارة المستخدمين والصلاحيات والاشتراكات.
دعم كامل لميزات ELD/HOS (تسجيل الحالات، حساب ساعات الخدمة، التقارير، التفتيش).
المراقبة في الوقت الحقيقي والاشتراكات.
إدارة الصيانة والمستندات والملفات.
ملاحظة هامة
الجزء الأول من التوثيق يغطي جميع نقاط النهاية الأساسية والمتقدمة لـ TraccarService و TraccarExtendedEndpoints، بما في ذلك إدارة الأجهزة، المواقع، التقارير، الأوامر، الصيانة، النسخ الاحتياطي، الأرشفة، إلخ.
الجزء الثاني يغطي نقاط النهاية المتعلقة بـ ELD/HOS فقط، وهي مجموعة فرعية متخصصة تهدف إلى الامتثال لمعايير FMCSA.
1.2. النظرة العامة
تعتمد واجهة API على ثلاث طبقات رئيسية:

الطبقة	الوصف
TraccarService	الخدمة الأساسية التي تتواصل مع خادم Traccar عبر GuzzleHTTP. تدير المصادقة، الجلسات، والطلبات (GET، POST، PUT، DELETE).
TraccarExtendedEndpoints	سمة (Trait) توفر نقاط نهاية متقدمة وإضافية مثل إدارة السائقين، التقارير الممتدة، الأوامر المجدولة، النسخ الاحتياطي، والأرشفة.
TraccarEldEndpoints	سمة (Trait) توفر نقاط نهاية خاصة بـ ELD/HOS مثل تسجيل حالة الخدمة، حساب ساعات الخدمة، اكتشاف المخالفات، التقارير، والتفتيش.
1.3. المسار الأساسي (Base URL)
https://your-domain.com/api/v1/tracker/traccar
جميع الطلبات تتطلب مصادقة عبر جلسة Traccar، ويتم إدارة الجلسة تلقائياً من خلال TraccarService باستخدام الـ Cookie المخزنة بعد تسجيل الدخول.

1.4. الاستجابة الموحدة
جميع نقاط النهاية تعيد استجابة موحدة تحتوي على:

الحقل	النوع	الوصف
code	integer	رمز الحالة (200 للنجاح، 400 للخطأ)
status	boolean	true للنجاح، false للفشل
data	mixed	البيانات المطلوبة (مصفوفة أو كائن)
message	string	رسالة توضيحية (في حالة النجاح أو الخطأ)
error	string	تفاصيل الخطأ (في حالة الفشل)
2.1. الميزات الأساسية
الميزة	الوصف
إدارة الأجهزة الشاملة	إنشاء، تحديث، حذف، واستعلام الأجهزة مع دعم البحث المتقدم والتصدير والاستيراد.
تتبع المواقع المتقدم	الحصول على المواقع التاريخية واللحظية مع دعم التصفية حسب الوقت والجهاز.
التقارير المتنوعة	تقارير المسارات، الرحلات، التوقفات، الأحداث، والملخصات مع نسخ ممتدة.
المناطق الجغرافية	إنشاء وتحديث وحذف المناطق الجغرافية مع دعم أنواع متعددة (دائرية، مضلعة، خطية).
إدارة المستخدمين	إدارة المستخدمين والصلاحيات والاشتراكات مع دعم البحث المتقدم.
الأوامر عن بعد	إرسال أوامر إلى الأجهزة (إيقاف التشغيل، إعادة التشغيل، تحديث الإعدادات، التقاط الصور).
دعم ELD/HOS كامل	تسجيل حالة الخدمة، حساب ساعات الخدمة، اكتشاف المخالفات، تقارير التفتيش، المستندات الداعمة.
المراقبة في الوقت الحقيقي	الاشتراك في تحديثات المواقع والأحداث، مراقبة السائقين في الوقت الحقيقي.
إدارة الملفات والمستندات	رفع وتحميل وحذف الملفات والمستندات الداعمة.
النسخ الاحتياطي والأرشفة	إنشاء نسخ احتياطية واستعادة البيانات، أرشفة البيانات القديمة.
المهام المجدولة	إنشاء وتشغيل مهام مجدولة (تقارير دورية، تنبيهات، صيانة).
التدقيق والمراجعة	سجلات التدقيق الكاملة مع إمكانية التصدير.
2.2. الفوائد للمطورين والمسؤولين
جاهز للإنتاج: معالجة استثنائية شاملة مع رسائل خطأ واضحة.
مرونة عالية: دعم جميع نقاط نهاية Traccar API مع إمكانية التوسع.
تكامل سلس: يمكن دمجها بسهولة مع أنظمة إدارة الأسطول، تطبيقات الهاتف المحمول، ولوحات التحكم.
أمان متقدم: جلسات مصادقة مع دعم Cookie وإعادة المصادقة التلقائية.
توثيق شامل: كل نقطة نهاية موثقة بشكل كامل مع أمثلة دقيقة.
قابلية التوسع: يمكن إضافة نقاط نهاية جديدة بسهولة عبر السمات (Traits).
3.1.1. الحصول على معلومات الجلسة الحالية
GET /session
الوصف: الحصول على معلومات الجلسة الحالية للمستخدم المسجل دخوله.

الاستجابة
الحقل	النوع	الوصف
id	integer	معرف الجلسة
userId	integer	معرف المستخدم
createdAt	string	وقت إنشاء الجلسة
expiresAt	string	وقت انتهاء الجلسة
ipAddress	string	عنوان IP للجلسة
userAgent	string	متصفح المستخدم
مثال
الطلب:

GET /api/v1/tracker/traccar/session
Authorization: Bearer <your_access_token>
الاستجابة:

{
    "code": 200,
    "status": true,
    "data": {
        "id": 1,
        "userId": 5,
        "createdAt": "2026-01-15T10:00:00Z",
        "expiresAt": "2026-01-15T22:00:00Z",
        "ipAddress": "192.168.1.100",
        "userAgent": "Mozilla\/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit\/537.36"
    }
}
