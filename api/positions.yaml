3.2.3. إنشاء منطقة جغرافية جديدة
POST /geofences

الوصف: إنشاء منطقة جغرافية جديدة في النظام.

معاملات Body (JSON)
المعامل	النوع	الإلزامية	الوصف	القيمة الافتراضية
name	string	نعم	اسم المنطقة	-
area	string	نعم	بيانات المنطقة الجغرافية (GeoJSON أو WKT)	-
description	string	لا	وصف المنطقة	null
attributes	object	لا	سمات إضافية	{}
ملاحظات حول تنسيق area
WKT (Well-Known Text): POLYGON ((lon1 lat1, lon2 lat2, ...))
GeoJSON: {"type":"Polygon","coordinates":[[[lon1,lat1],[lon2,lat2],...]]}
مثال
الطلب:

POST /api/v1/tracker/traccar/geofences
Authorization: Bearer <your_access_token>
Content-Type: application/json

{
  "name": "Dammam Zone",
  "area": "POLYGON ((49.9 26.3, 50.1 26.3, 50.1 26.6, 49.9 26.6, 49.9 26.3))",
  "description": "Dammam city center area",
  "attributes": {
    "color": "#0000FF",
    "radius": 4000,
    "type": "polygon"
  }
}
الاستجابة:

{
    "code": 201,
    "status": true,
    "message": "تم إنشاء المنطقة الجغرافية بنجاح",
    "data": {
        "id": 5,
        "name": "Dammam Zone",
        "area": "POLYGON ((49.9 26.3, 50.1 26.3, 50.1 26.6, 49.9 26.6, 49.9 26.3))",
        "description": "Dammam city center area",
        "attributes": {
            "color": "#0000FF",
            "radius": 4000,
            "type": "polygon"
        }
    }
}
