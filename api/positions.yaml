3.2.1. الحصول على قائمة المناطق الجغرافية
GET /geofences

الوصف: الحصول على قائمة بجميع المناطق الجغرافية المسجلة في النظام مع إمكانية البحث.

معاملات Query
المعامل	النوع	الإلزامية	الوصف
search	string	لا	بحث في اسم المنطقة
الاستجابة
الحقل	النوع	الوصف
id	integer	معرف المنطقة
name	string	اسم المنطقة
area	string	بيانات المنطقة الجغرافية (GeoJSON أو WKT)
description	string	وصف المنطقة
attributes	object	سمات إضافية (مثل اللون، نصف القطر)
