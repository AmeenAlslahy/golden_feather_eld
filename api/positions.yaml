1. نظرة عامة
توفر هذه المجموعة من نقاط النهاية واجهة كاملة لإدارة المواقع (Positions) والمناطق الجغرافية (Geofences) في خادم Traccar. تشمل العمليات الحصول على المواقع التاريخية واللحظية، وتصفيتها حسب الجهاز والفترة الزمنية، بالإضافة إلى إنشاء وتحديث وحذف المناطق الجغرافية التي تستخدم لتحديد نطاقات جغرافية محددة وإطلاق التنبيهات عند دخول أو خروج الأجهزة منها.

تعتبر المواقع هي البيانات الأساسية التي توفرها أجهزة التتبع، حيث تحتوي على إحداثيات خط الطول والعرض، السرعة، الاتجاه، والارتفاع. بينما تساعد المناطق الجغرافية في تحديد نطاقات جغرافية محددة (مثل المستودعات، الموانئ، المناطق المحظورة) وإطلاق تنبيهات عند دخول أو خروج الأجهزة منها.

2. الفوائد والميزات
تتبع المواقع الشامل: الحصول على المواقع التاريخية واللحظية مع دعم التصفية حسب الجهاز والفترة الزمنية.
الموقع الأحدث: الحصول على أحدث موقع معروف لجهاز معين بسرعة.
إدارة المناطق الجغرافية: إنشاء، تحديث، حذف، واستعلام المناطق الجغرافية بأنواعها المختلفة (دائرية، مضلعة، خطية).
تنبيهات المناطق الجغرافية: استخدام المناطق الجغرافية لتشغيل تنبيهات عند دخول أو خروج الأجهزة.
مرونة في التنسيق: دعم تنسيقات متعددة لتحديد المنطقة (GeoJSON، WKT).
3.1.1. الحصول على قائمة المواقع
GET /positions

الوصف: الحصول على قائمة بمواقع الأجهزة مع إمكانية التصفية حسب الجهاز والفترة الزمنية.

معاملات Query
المعامل	النوع	الإلزامية	الوصف	القيمة الافتراضية
deviceId	integer	لا	تصفية حسب معرف الجهاز	-
from	string	لا	تاريخ البداية (ISO 8601)	-
to	string	لا	تاريخ النهاية (ISO 8601)	-
limit	integer	لا	الحد الأقصى لعدد النتائج	100
offset	integer	لا	الإزاحة للترقيم	0
الاستجابة
الحقل	النوع	الوصف
id	integer	معرف الموقع
deviceId	integer	معرف الجهاز
latitude	float	خط العرض
longitude	float	خط الطول
speed	float	السرعة (كم/س)
course	float	الاتجاه (درجات)
altitude	float	الارتفاع (متر)
accuracy	float	دقة الموقع (متر)
fixTime	string	وقت التحديث من الجهاز
deviceTime	string	وقت الجهاز
serverTime	string	وقت الخادم
attributes	object	سمات إضافية (مثل مستوى البطارية، إشارة GSM، مستوى الوقود)
مثال
الطلب:

GET /api/v1/tracker/traccar/positions?deviceId=101&from=2026-01-15T00:00:00Z&to=2026-01-15T23:59:59Z&limit=10
Authorization: Bearer <your_access_token>
