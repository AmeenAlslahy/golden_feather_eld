4.1. تصدير المواقع إلى CSV
GET /export/positions/csv

الوصف: تصدير مواقع الأجهزة إلى ملف CSV مع إمكانية التصفية حسب الجهاز والفترة الزمنية.

معاملات Query
المعامل	النوع	الإلزامية	الوصف
deviceId	integer	نعم	معرف الجهاز
from	string	نعم	تاريخ البداية (ISO 8601)
to	string	نعم	تاريخ النهاية (ISO 8601)
مثال
الطلب:

GET /api/v1/tracker/traccar/export/positions/csv?deviceId=101&from=2026-01-15T00:00:00Z&to=2026-01-15T23:59:59Z
Authorization: Bearer <your_access_token>
الاستجابة: ملف CSV يتم تحميله مباشرة.

5. التنبيهات والتوصيات
التنبيه	الوصف
نطاق التواريخ	عند طلب المواقع التاريخية، حدد نطاقاً زمنياً معقولاً (يفضل أقل من 30 يوماً) لتحسين الأداء.
تنسيق المنطقة الجغرافية	تأكد من صحة تنسيق area (WKT أو GeoJSON) قبل الإرسال. التنسيق غير الصحيح سيؤدي إلى فشل الإنشاء.
تداخل المناطق	يمكن أن تتداخل المناطق الجغرافية، مما قد يؤدي إلى تنبيهات متكررة. خطط لتصميم المناطق بعناية.
حذف المناطق	حذف منطقة جغرافية قد يؤثر على التنبيهات المرتبطة بها. تأكد من تحديث التنبيهات قبل الحذف.
الترقيم	استخدم limit و offset عند جلب كميات كبيرة من المواقع لتجنب مشاكل الأداء.
الموقع الأحدث	قد لا يكون الموقع الأحدث متاحاً إذا كان الجهاز غير متصل. تحقق من حالة الجهاز أولاً.
6. الخاتمة
تغطي هذه المجموعة جميع عمليات إدارة المواقع والمناطق الجغرافية الأساسية. توفر نقاط النهاية المرونة اللازمة لتتبع الأجهزة وتحديد نطاقات جغرافية محددة، مما يسهل بناء أنظمة تتبع متقدمة مع تنبيهات ذكية.

