name: golden_feather_eld
description: Golden Feather ELD - Electronic Logging Device for Field Compliance Tracking
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  
  # Clean Architecture & State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  go_router: ^14.2.0
  
  # Functional Programming
  equatable: ^2.0.5
  
  # Network
  dio: ^5.4.3+1
  connectivity_plus: ^6.0.3
  
  # Local Storage
  shared_preferences: ^2.2.3
  hive_flutter: ^1.1.0
  hive: ^2.2.3
  flutter_secure_storage: ^10.3.1
  
  # Tracking
  geolocator: ^12.0.0
  geocoding: ^3.0.0
  
  # UI
  google_fonts: ^6.2.1
  flutter_screenutil: ^5.9.3
  shimmer: ^3.0.0
  cached_network_image: ^3.3.1
  
  # Media
  image_picker: ^1.0.7
  signature: ^6.4.0
  
  # QR & Barcode
  mobile_scanner: ^5.1.1
  
  # Firebase
  firebase_core: ^2.30.1
  firebase_crashlytics: ^3.5.5
  firebase_messaging: ^14.9.1
  
  # Export
  pdf: ^3.11.1
  share_plus: ^9.0.0
  
  # Utils
  path_provider: ^2.1.3
  package_info_plus: ^8.0.0
  url_launcher: ^6.3.0
  uuid: ^4.4.0
  logger: ^2.3.0
  permission_handler: ^11.3.1
  quick_actions: ^1.1.0
  sqflite: ^2.4.2
  path: ^1.9.1
  flutter_dotenv: ^6.0.1
  fpdart: ^1.2.0
  internet_connection_checker: ^3.0.1

  shared_preferences_android: any
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  riverpod_generator: ^2.4.0
  build_runner: ^2.4.9
  mocktail: ^1.0.3
  very_good_analysis: ^5.1.0
  flutter_launcher_icons: ^0.14.4
  http_mock_adapter: ^0.6.1

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/
    - assets/fonts/
    - .env
  
  generate: true

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/ic_launcher.png"
  adaptive_icon_background: "#0072CE"
  adaptive_icon_foreground: "assets/images/ic_launcher.png"

