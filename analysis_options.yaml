# تحليل 100% نظيف — يفرض الهوية الموحدة والمعمارية النظيفة والمرونة
analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
  errors:
    invalid_annotation_target: ignore
include: package:flutter_lints/flutter.yaml

linter:
  rules:
    # ========== النظافة والاتساق ==========
    prefer_const_constructors: true
    prefer_const_literals_to_create_immutables: true
    use_key_in_widget_constructors: true
    avoid_print: true
    avoid_empty_else: true
    avoid_returning_null_for_void: true
    avoid_renaming_method_parameters: false
    # ========== الأداء والسرعة ==========
    avoid_unnecessary_containers: true
    sized_box_for_whitespace: true  # ثم استبدله بـ AppGap
    prefer_const_declarations: true
    # ========== الدقة والسلامة ==========
    cancel_subscriptions: true
    close_sinks: true
    use_build_context_synchronously: true
    avoid_positional_boolean_parameters: true
    # ========== الصيانة والتطوير ==========
    public_member_api_docs: false
    directives_ordering: true
    prefer_single_quotes: true
    sort_child_properties_last: true
    # ========== التكامل والمعمارية ==========
    # يمنع استيراد Data في Presentation — يفحص يدوياً عبر CI (انظر docs/ARCH_GUARD.md)
    # avoid_relative_lib_imports: true

# ========== Clean Architecture Guard ==========
# يُفحص عبر سكربت CI — lib/features/*/presentation لا تستورد lib/features/*/data/*
# إلا عبر lib/features/*/data/providers/*
# انظر: core/arch/ARCH_GUARD.md
